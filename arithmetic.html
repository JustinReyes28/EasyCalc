<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A fast, private arithmetic calculator with keyboard entry, parentheses, and no external dependencies.">
    <title>Arithmetic Calculator - EasyCalc</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="calculator-engine.js" defer></script>
    <script src="history-core.js" defer></script>
    <script src="calculator.js" defer></script>
</head>
<body>
    <main class="calculator-container">
        <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">=</span>EasyCalc</a>
        <header class="page-heading">
            <h1>Arithmetic calculator</h1>
        </header>
        <nav class="calculator-tabs" aria-label="Calculator type">
            <a href="arithmetic.html" aria-current="page">Arithmetic</a>
            <a href="scientific.html">Scientific</a>
        </nav>
        <section class="calculator" aria-label="Arithmetic calculator">
            <div class="calculator-toolbar"><button id="copy-result" class="text-button" type="button" disabled>Copy result</button></div>
            <div class="display-panel">
                <label for="display">Expression</label>
                <input type="text" class="display" id="display" placeholder="0" maxlength="256" autocomplete="off" spellcheck="false" inputmode="decimal" aria-describedby="calculation-feedback keyboard-help">
                <p id="calculation-feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
            </div>
            <div class="buttons">
                <button type="button" class="btn clear" data-action="clear" aria-label="Clear expression">AC</button>
                <button type="button" class="btn function" data-value="(" aria-label="Open parenthesis">(</button>
                <button type="button" class="btn function" data-value=")" aria-label="Close parenthesis">)</button>
                <button type="button" class="btn function" data-action="backspace" aria-label="Delete last character">⌫</button>
                <button type="button" class="btn" data-value="7">7</button>
                <button type="button" class="btn" data-value="8">8</button>
                <button type="button" class="btn" data-value="9">9</button>
                <button type="button" class="btn operator" data-value="/" aria-label="Divide">÷</button>
                <button type="button" class="btn" data-value="4">4</button>
                <button type="button" class="btn" data-value="5">5</button>
                <button type="button" class="btn" data-value="6">6</button>
                <button type="button" class="btn operator" data-value="*" aria-label="Multiply">×</button>
                <button type="button" class="btn" data-value="1">1</button>
                <button type="button" class="btn" data-value="2">2</button>
                <button type="button" class="btn" data-value="3">3</button>
                <button type="button" class="btn operator" data-value="-" aria-label="Subtract">−</button>
                <button type="button" class="btn" data-value="0">0</button>
                <button type="button" class="btn" data-value="." aria-label="Decimal point">.</button>
                <button type="button" class="btn function" data-value="ans" aria-label="Previous answer">Ans</button>
                <button type="button" class="btn operator" data-value="+" aria-label="Add">+</button>
                <button type="button" class="btn equals span-four" data-action="calculate" aria-label="Calculate result">=</button>
            </div>
        </section>
        <details class="calculation-history" id="calculation-history">
            <summary>History <span id="history-count">(0)</span></summary>
            <div class="history-content">
                <button type="button" class="history-button clear-history" id="clear-history" hidden>Clear history</button>
                <p class="history-empty" id="history-empty">No calculations yet.</p>
                <ol class="history-list" id="history-list" aria-label="Calculation history" hidden></ol>
            </div>
        </details>
        <p class="keyboard-help" id="keyboard-help"><kbd>Enter</kbd> to calculate · <kbd>Esc</kbd> to clear<br>Type or paste an expression. Use <strong>Ans</strong> for your last result.</p>
        <a href="index.html" class="back-link">← All calculators</a>
        <noscript><p class="noscript">Enable JavaScript to calculate.</p></noscript>
    </main>
    <footer><p>&copy; 2025 EasyCalc</p></footer>
</body>
</html>
