<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Conversion - EasyCalc</title>
    <link rel="stylesheet" href="unit-conversion.css">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div class="calculator-container">
        <header>
            <h1>Unit Conversion</h1>
        </header>

        <div class="calculator-grid">
            <!-- Length Conversion Card -->
            <section class="calculator-card" data-converter="length" aria-labelledby="length-heading">
                <h2 id="length-heading">Length</h2>
                <div class="input-group">
                    <label for="length-input">Value:</label>
                    <input type="number" step="any" inputmode="decimal" id="length-input" aria-describedby="length-feedback" placeholder="Enter length">
                    <p class="input-feedback" id="length-feedback"></p>
                </div>
                <div class="input-group">
                    <label for="from-length-unit">From:</label>
                    <select id="from-length-unit">
                        <option value="m">Meter</option>
                        <option value="km">Kilometer</option>
                        <option value="cm">Centimeter</option>
                        <option value="mm">Millimeter</option>
                        <option value="mi">Mile</option>
                        <option value="yd">Yard</option>
                        <option value="ft">Foot</option>
                        <option value="in">Inch</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="to-length-unit">To:</label>
                    <select id="to-length-unit">
                        <option value="m">Meter</option>
                        <option value="km">Kilometer</option>
                        <option value="cm">Centimeter</option>
                        <option value="mm">Millimeter</option>
                        <option value="mi">Mile</option>
                        <option value="yd">Yard</option>
                        <option value="ft">Foot</option>
                        <option value="in">Inch</option>
                    </select>
                </div>
                <div class="converter-actions">
                    <button type="button" class="swap-units" id="length-swap" aria-label="Swap length units">Swap units</button>
                    <button type="button" class="copy-result" id="length-copy" aria-label="Copy length result" disabled>Copy result</button>
                </div>
                <div class="result" id="length-result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">Result: <span id="length-result-value">&mdash;</span><span id="length-result-unit"></span></div>
                <p class="copy-feedback" id="length-copy-feedback" role="status"></p>
            </section>

            <!-- Weight Conversion Card -->
            <section class="calculator-card" data-converter="weight" aria-labelledby="weight-heading">
                <h2 id="weight-heading">Weight</h2>
                <div class="input-group">
                    <label for="weight-input">Value:</label>
                    <input type="number" step="any" inputmode="decimal" id="weight-input" aria-describedby="weight-feedback" placeholder="Enter weight">
                    <p class="input-feedback" id="weight-feedback"></p>
                </div>
                <div class="input-group">
                    <label for="from-weight-unit">From:</label>
                    <select id="from-weight-unit">
                        <option value="kg">Kilogram</option>
                        <option value="g">Gram</option>
                        <option value="mg">Milligram</option>
                        <option value="lb">Pound</option>
                        <option value="oz">Ounce</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="to-weight-unit">To:</label>
                    <select id="to-weight-unit">
                        <option value="kg">Kilogram</option>
                        <option value="g">Gram</option>
                        <option value="mg">Milligram</option>
                        <option value="lb">Pound</option>
                        <option value="oz">Ounce</option>
                    </select>
                </div>
                <div class="converter-actions">
                    <button type="button" class="swap-units" id="weight-swap" aria-label="Swap weight units">Swap units</button>
                    <button type="button" class="copy-result" id="weight-copy" aria-label="Copy weight result" disabled>Copy result</button>
                </div>
                <div class="result" id="weight-result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">Result: <span id="weight-result-value">&mdash;</span><span id="weight-result-unit"></span></div>
                <p class="copy-feedback" id="weight-copy-feedback" role="status"></p>
            </section>

            <!-- Volume Conversion Card -->
            <section class="calculator-card" data-converter="volume" aria-labelledby="volume-heading">
                <h2 id="volume-heading">Volume</h2>
                <div class="input-group">
                    <label for="volume-input">Value:</label>
                    <input type="number" step="any" inputmode="decimal" id="volume-input" aria-describedby="volume-feedback" placeholder="Enter volume">
                    <p class="input-feedback" id="volume-feedback"></p>
                </div>
                <div class="input-group">
                    <label for="from-volume-unit">From:</label>
                    <select id="from-volume-unit">
                        <option value="l">Liter</option>
                        <option value="ml">Milliliter</option>
                        <option value="gal">Gallon</option>
                        <option value="qt">Quart</option>
                        <option value="pt">Pint</option>
                        <option value="cup">Cup</option>
                        <option value="fl-oz">Fluid Ounce</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="to-volume-unit">To:</label>
                    <select id="to-volume-unit">
                        <option value="l">Liter</option>
                        <option value="ml">Milliliter</option>
                        <option value="gal">Gallon</option>
                        <option value="qt">Quart</option>
                        <option value="pt">Pint</option>
                        <option value="cup">Cup</option>
                        <option value="fl-oz">Fluid Ounce</option>
                    </select>
                </div>
                <div class="converter-actions">
                    <button type="button" class="swap-units" id="volume-swap" aria-label="Swap volume units">Swap units</button>
                    <button type="button" class="copy-result" id="volume-copy" aria-label="Copy volume result" disabled>Copy result</button>
                </div>
                <div class="result" id="volume-result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">Result: <span id="volume-result-value">&mdash;</span><span id="volume-result-unit"></span></div>
                <p class="copy-feedback" id="volume-copy-feedback" role="status"></p>
            </section>

            <!-- Temperature Conversion Card -->
            <section class="calculator-card" data-converter="temp" aria-labelledby="temp-heading">
                <h2 id="temp-heading">Temperature</h2>
                <div class="input-group">
                    <label for="temp-input">Value:</label>
                    <input type="number" step="any" inputmode="decimal" id="temp-input" aria-describedby="temp-feedback" placeholder="Enter temperature">
                    <p class="input-feedback" id="temp-feedback"></p>
                </div>
                <div class="input-group">
                    <label for="from-temp-unit">From:</label>
                    <select id="from-temp-unit">
                        <option value="c">Celsius</option>
                        <option value="f">Fahrenheit</option>
                        <option value="k">Kelvin</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="to-temp-unit">To:</label>
                    <select id="to-temp-unit">
                        <option value="c">Celsius</option>
                        <option value="f">Fahrenheit</option>
                        <option value="k">Kelvin</option>
                    </select>
                </div>
                <div class="converter-actions">
                    <button type="button" class="swap-units" id="temp-swap" aria-label="Swap temperature units">Swap units</button>
                    <button type="button" class="copy-result" id="temp-copy" aria-label="Copy temperature result" disabled>Copy result</button>
                </div>
                <div class="result" id="temp-result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">Result: <span id="temp-result-value">&mdash;</span><span id="temp-result-unit"></span></div>
                <p class="copy-feedback" id="temp-copy-feedback" role="status"></p>
            </section>

            <!-- Time Conversion Card -->
            <section class="calculator-card" data-converter="time" aria-labelledby="time-heading">
                <h2 id="time-heading">Time</h2>
                <div class="input-group">
                    <label for="time-input">Value:</label>
                    <input type="number" step="any" inputmode="decimal" id="time-input" aria-describedby="time-feedback time-note" placeholder="Enter time">
                    <p class="input-feedback" id="time-feedback"></p>
                </div>
                <div class="input-group">
                    <label for="from-time-unit">From:</label>
                    <select id="from-time-unit">
                        <option value="ns">Nanosecond</option>
                        <option value="μs">Microsecond</option>
                        <option value="ms">Millisecond</option>
                        <option value="s">Second</option>
                        <option value="min">Minute</option>
                        <option value="hr">Hour</option>
                        <option value="day">Day</option>
                        <option value="wk">Week</option>
                        <option value="mo">Month</option>
                        <option value="yr">Year</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="to-time-unit">To:</label>
                    <select id="to-time-unit">
                        <option value="ns">Nanosecond</option>
                        <option value="μs">Microsecond</option>
                        <option value="ms">Millisecond</option>
                        <option value="s">Second</option>
                        <option value="min">Minute</option>
                        <option value="hr">Hour</option>
                        <option value="day">Day</option>
                        <option value="wk">Week</option>
                        <option value="mo">Month</option>
                        <option value="yr">Year</option>
                    </select>
                </div>
                <p class="unit-note" id="time-note" hidden></p>
                <div class="converter-actions">
                    <button type="button" class="swap-units" id="time-swap" aria-label="Swap time units">Swap units</button>
                    <button type="button" class="copy-result" id="time-copy" aria-label="Copy time result" disabled>Copy result</button>
                </div>
                <div class="result" id="time-result" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">Result: <span id="time-result-value">&mdash;</span><span id="time-result-unit"></span></div>
                <p class="copy-feedback" id="time-copy-feedback" role="status"></p>
            </section>
        </div>

        <a href="index.html" class="back-link">← Back to Calculator Suite</a>
    </div>

    <script src="unit-conversion.js"></script>
    <footer>
        <div class="footer-content">
            <p>&copy; 2025 EasyCalc</p>
        </div>
    </footer>
</body>
</html>
